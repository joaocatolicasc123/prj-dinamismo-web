<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>N2 Luiz</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="toast-container"></div>

    <header>
      <h1>Painel Administrativo</h1>
      <p style="color: #b0bec5; font-size: 14px; margin-top: 5px;">Gerenciamento integrado de usuários e publicações</p>
    </header>

    <main class="conteudo">
      <section class="formularios">
        <div class="box">
          <h2>Cadastrar / Editar Usuário</h2>

          <form id="form-usuario">
            <input type="hidden" id="usuario-id" />
            <input
              type="text"
              id="usuario-nome"
              placeholder="Nome completo do usuário"
              required
            />

            <div class="botoes-grupo">
              <button type="submit" id="btn-usuario" class="btn-principal">Adicionar Usuário</button>
              <button type="button" id="btn-cancelar-usuario" class="btn-cancelar" style="display: none;">Cancelar</button>
            </div>
          </form>
        </div>

        <div class="box">
          <h2>Criar / Editar Post</h2>

          <form id="form-posts">
            <input type="hidden" id="posts-id" />

            <select id="post-userId" required>
              <option value="">Selecione um autor</option>
            </select>

            <input type="text" id="post-titulo" placeholder="Título da publicação" required />

            <textarea
              id="post-corpo"
              placeholder="Conteúdo descritivo do post..."
              required
            ></textarea>

            <div class="botoes-grupo">
              <button type="submit" id="btn-post" class="btn-principal">Adicionar Post</button>
              <button type="button" id="btn-cancelar-post" class="btn-cancelar" style="display: none;">Cancelar</button>
            </div>
          </form>
        </div>
      </section>

      <section class="box">
        <h2>Usuários Cadastrados</h2>
        <ul id="lista-usuarios"></ul>
      </section>

      <section class="box">
        <h2>Posts Cadastrados</h2>
        <ul id="lista-posts"></ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
